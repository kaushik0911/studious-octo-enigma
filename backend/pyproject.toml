[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "backend"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "sentence-transformers>=6.0.0",
    "sqladmin[auth]>=0.31.0",
    "sqlmodel>=0.0.39",
    "streamlit>=1.62.0",
    "torchvision>=0.28.0",
]

[tool.uv.build-backend]
module-root = "src"
module-name = ["routers", "views"]
